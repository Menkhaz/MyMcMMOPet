name: MyMCMMOPet
main: io.github.takato65.mymcmmopet.MyMCMMOPet
version: '${project.version}'
description: Awards mcMMO Taming experience for MyPet 4 combat.
depend: [mcMMO, MyPet]
api-version: '1.21'
permissions:
  mymcmmopet.xp:
    description: Allows Taming XP from MyPet damage (also requires mcMMO Taming permission).
    default: true
